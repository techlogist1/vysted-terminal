name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable

      # GitHub's macos-latest image ships a non-standard Rust layout: every
      # ~/.cargo/bin proxy is a symlink to `rustup`, which symlinks to the
      # `rustup-init` binary. The tauri CLI can resolve `cargo` through that
      # chain and invoke it in installer mode (`cargo metadata` -> rustup-init).
      # Point CARGO and PATH straight at the real toolchain binary instead.
      - name: Use the real rustup toolchain cargo (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          toolchain_bin="$(dirname "$(rustup which cargo)")"
          echo "CARGO=$toolchain_bin/cargo" >> "$GITHUB_ENV"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          "$toolchain_bin/cargo" --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all Python sidecar binaries
        run: node scripts/ensure-all-sidecars.mjs

      - name: Smoke-test sidecar binaries (catches PackageNotFoundError-at-runtime)
        run: node scripts/smoke-test-sidecars.mjs

      - name: Build Tauri bundle (unsigned)
        env:
          # Same linuxdeploy/FUSE + strip defenses as release.yml's build-linux
          # job (see its comments) — no-ops on macOS/Windows.
          APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
          NO_STRIP: ${{ matrix.os == 'ubuntu-latest' && 'true' || '' }}
        run: pnpm tauri build

      - name: Smoke-test bundled llama-server (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          "$APP/Contents/MacOS/llama-server" --version

      - name: Smoke-test bundled llama-server (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)"
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          LLAMA_BIN="$(find squashfs-root -type f -name 'llama-server' | head -1)"
          LLAMA_LIB_DIR="$(dirname "$(find squashfs-root -type d -name 'llama-libs' | head -1)")/llama-libs"
          LD_LIBRARY_PATH="$LLAMA_LIB_DIR" "$LLAMA_BIN" --version

      - name: Smoke-test bundled llama-server (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          NSIS="$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -iname '*-setup.exe' | head -1)"
          INSTDIR="${RUNNER_TEMP}\\llama-smoke"
          "$NSIS" /S "/D=$INSTDIR"
          for i in $(seq 1 30); do
            [ -f "$INSTDIR/llama-server.exe" ] && break
            sleep 2
          done
          "$INSTDIR/llama-server.exe" --version

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vysted-terminal-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
