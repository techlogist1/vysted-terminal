[package]
name = "vysted-terminal"
version = "0.8.0"
description = "Vysted Terminal — open-source AI-native finance terminal."
authors = ["Lokavya <commercial@vysted.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "vysted_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Dev-only test-automation rig (DaveDev42/tauri-plugin-mcp). NEVER enabled in
# release builds — `tauri build` omits it, so both the plugin and its
# `mcp:default` capability (generated by build.rs) are compiled out entirely.
# Enable for local automation only: `tauri dev --features dev-tools`.
dev-tools = ["dep:tauri-plugin-mcp"]

[dependencies]
tauri = { version = "2", features = [] }
# Dev-only; pulled in solely by the `dev-tools` feature above. Pinned to a SHA
# (git dep, not on crates.io) for reproducible builds.
tauri-plugin-mcp = { git = "https://github.com/DaveDev42/tauri-plugin-mcp", rev = "bedc4acb3ad995ca42a070149a2dad6ae219389a", optional = true }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
